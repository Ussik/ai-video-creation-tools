# Based on Langfuse v4.79.0's official Docker Compose; isolated local deployment.
# Credentials are generated by scripts/langfuse-local.mjs into an ignored env file.
name: ai-video-studio-langfuse

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: http://127.0.0.1:3035
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD:?run langfuse:local setup}@postgres:5432/langfuse
  SALT: ${SALT:?run langfuse:local setup}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run langfuse:local setup}
  TELEMETRY_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run langfuse:local setup}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  CLICKHOUSE_CLUSTER_NAME: default
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run langfuse:local setup}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run langfuse:local setup}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run langfuse:local setup}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run langfuse:local setup}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?run langfuse:local setup}
  REDIS_TLS_ENABLED: "false"

x-langfuse-dependencies: &langfuse-dependencies
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.79.0@sha256:ab20d54ee3304ffc9f73965d9dde665eed64111ae32fca96b7449fc90d246bbe
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    ports:
      - "127.0.0.1:3035:3000"
    environment:
      <<: *langfuse-environment
      HOSTNAME: "0.0.0.0"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:9095
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run langfuse:local setup}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:?run langfuse:local setup}
      LANGFUSE_INIT_ORG_NAME: AI Video Studio Local
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:?run langfuse:local setup}
      LANGFUSE_INIT_PROJECT_NAME: AI Video Studio Local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?run langfuse:local setup}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?run langfuse:local setup}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?run langfuse:local setup}
      LANGFUSE_INIT_USER_NAME: Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?run langfuse:local setup}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.79.0@sha256:35e1ff6578a7d43458bf45c92eb46fcefa753967008d58bd98c961a09b1b3f03
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    environment:
      <<: *langfuse-environment

  postgres:
    image: docker.io/postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run langfuse:local setup}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langfuse", "-d", "langfuse"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run langfuse:local setup}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: docker.io/redis:7.4.5-alpine
    restart: unless-stopped
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?run langfuse:local setup}
    # Write the password to an internal private config, not a process argument.
    command: ["sh", "-c", "umask 077; printf 'requirepass %s\\nmaxmemory-policy noeviction\\nappendonly yes\\n' \"$$REDIS_AUTH\" > /tmp/langfuse-redis.conf; exec redis-server /tmp/langfuse-redis.conf"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_AUTH\" redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    # Official Langfuse Compose uses this image; pin its multi-arch index.
    image: cgr.dev/chainguard/minio@sha256:96b6cf3e14084d3427ec46de10c2873af61b945ad9272eec266cfc8df551cba5
    restart: unless-stopped
    entrypoint: sh
    command: ["-c", "mkdir -p /data/langfuse && exec minio server --address ':9000' /data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run langfuse:local setup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run langfuse:local setup}
    ports:
      - "127.0.0.1:9095:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  minio-data:
